spring:
  application:
    name: get_jobs
  profiles:
    active: dev
  info:
    app:
      name: Get Jobs
      version: 0.0.1-SNAPSHOT
      description:
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    hikari:
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  output:
    ansi:
      enabled: always

server:
  port: 8889

logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ./target/logs/get-jobs.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

security:
  jwt:
    issuer: jobs-backend
    secret: ${JWT_SECRET:change-me-to-a-64-byte-secret-change-me-to-a-64-byte-secret}
    access-token-expire-seconds: 7200
